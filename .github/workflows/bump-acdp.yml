name: bump acdp
on:
  repository_dispatch:
    types: [acdp-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact acdp version (blank = latest / event payload)'
        required: false
        default: ''
jobs:
  bump:
    uses: agentcontextdistributionprotocol/acdp-ci/.github/workflows/bump-consume.yml@v1
    with:
      ecosystem: uv
      package: acdp
      version: ${{ github.event.inputs.version }}
    secrets:
      ACDP_BOT_APP_ID: '${{ secrets.ACDP_BOT_APP_ID }}'
      ACDP_BOT_PRIVATE_KEY: '${{ secrets.ACDP_BOT_PRIVATE_KEY }}'
