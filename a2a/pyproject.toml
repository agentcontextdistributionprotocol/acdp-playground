[project]
name = "acdp-a2a-demo"
version = "0.1.0"
description = "RFC-ACDP-0022 demo: two a2a-sdk agents, a producer that signs its artifacts through acdp-rs's acdp-a2a and a client that verifies them with acdp-verifier-py."
requires-python = ">=3.12"
dependencies = [
    # The official A2A Python SDK, protocol v1.0.x.
    "a2a-sdk[http-server]==1.3.0",
    # The playground's own transport layer (acdp_client) and the `acdp` wheel.
    "acdp-playground",
    # The independent RFC-0022 holder (acdp_verifier.a2a), PR #116.
    "acdp-verifier",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.uv]
# A demo, not a package: nothing here is built or published, and the deployed
# playground app neither imports nor installs it.
package = false

[tool.uv.sources]
acdp-playground = { path = "..", editable = true }
# Deliberately not on PyPI (see its README "Distribution"): consumed from git,
# pinned to the commit that merged the RFC-0022 holder (#116).
acdp-verifier = { git = "https://github.com/agentcontextdistributionprotocol/acdp-verifier-py", rev = "f9a7936037721b1d4f6f655d7c6461dc8cbbfac8" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
