[package]
name        = "acdp-a2a-sidecar"
version     = "0.1.0"
edition     = "2021"
publish     = false
description = "JSON-lines bridge from a Python a2a-sdk agent to acdp-rs's acdp-a2a producer (RFC-ACDP-0022). No protocol logic of its own."
license     = "Apache-2.0"

[[bin]]
name = "acdp-a2a-sidecar"
path = "src/main.rs"

[dependencies]
# acdp-rs 0.21.4 from crates.io (tag acdp-v0.21.4, 28e690d): enforces the
# RFC-0001 §5.11 DID document Content-Type (application/did+json or
# application/json).
acdp       = { version = "=0.21.4", default-features = false, features = ["client"] }
acdp-a2a   = { version = "=0.21.4" }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
hex        = "0.4"
