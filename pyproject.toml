[project]
name = "acdp-playground"
version = "0.1.0"
description = "ACDP Playground — runs scenarios, drives agents, streams events."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # 0.2.0 adds AcdpCanonicalizer + AcdpSsrfPolicy, which acdp_client now
    # delegates JCS canonicalization and SSRF classification to; 0.3.0 adds the
    # did:web helpers (AcdpDid / AcdpDidDocument) the s19 scenario resolves with.
    # 0.4.0 is the ACDP 0.2 trust-hardening surface: AcdpVerifier.verify_receipt
    # / verify_body_offline / explain_hash_mismatch / canonical_preimage /
    # fingerprint_ed25519_b64, the did:key producer constructors
    # (generate_did_key / from_seed_did_key), and build_*_request(acdp_version=,
    # omit_acdp_version=) — driven by the S22–S26 scenarios.
    # 0.5.0 adds AcdpDidDocument.receipt_key_for_algorithm — the RFC-ACDP-0010
    # §9 retired-receipt-key lifecycle (historical flag / key_not_found) the
    # S24 and S27 scenarios resolve registry + producer keys through.
    # 0.6.0 is the ACDP 0.3.0 surface (RFC-ACDP-0011/0012/0013/0014):
    # AcdpVerifier.verify_lineage_head_receipt / verify_log_checkpoint /
    # verify_log_inclusion / verify_log_consistency / build_log_leaf /
    # verify_lifecycle_event / parse_key_revocation / classify_under_revocation,
    # the AcdpMerkle helpers, and the typed ImmutableField /
    # InvalidLifecycleTransition / InvalidLogProof exceptions — driven by the
    # S28–S30 scenarios.
    # 0.7.0 is the ACDP 0.4 witness-cosigning surface (RFC-ACDP-0015):
    # AcdpVerifier.build_witness_cosignature / verify_witness_cosignature /
    # evaluate_witness_quorum — a transparency-log checkpoint is cosigned by
    # independent witnesses and the consumer evaluates an N-witnessed quorum —
    # driven by the S31 scenario.
    # 0.8.0/0.8.1 unify the whole acdp family (crate + language bindings) onto
    # a single lockstep version — no new API surface over 0.7.0.
    # 0.8.2/0.8.3 add the RFC-ACDP-0016 anchors surface: build_publish_request/
    # build_supersede_request gain `anchors` (a JSON-encoded array of
    # {scheme, content_hash, uri?, ...extensions} objects), and
    # build_supersede_request gains `clear_anchors` — omitting `anchors` now
    # correctly carries the previous version's anchors forward, and
    # clear_anchors=True is the explicit way to drop them — driven by the S33
    # scenario.
    # 0.9.0–0.14.1 is a large release range with a small Python-visible surface:
    # the `acdp` module is offline-only JSON-over-FFI (eight classes, no
    # RegistryClient, no networking), so every client/server crate change in
    # that span is structurally invisible here. Only three things reach a Python
    # caller by breaking or adding surface. (1) AcdpVerifier.verify_receipt gains `body_json` as argument #2
    # (arity 5 → 6) and now runs RegistryReceipt::cross_check_body — RFC-ACDP-0010
    # §8 step 3, binding the receipt's lineage_id / origin_registry / created_at
    # to the served body's. All seven call sites here pass the served body; S23
    # and S27 gained synthesized bodies (playground.scenarios._receipts.
    # synthesize_retrieval_body) and S23 two new tamper cases for the two new
    # bindings. (2) CtxId::parse replaces the bare CtxId newtype in
    # build_publish_request(derived_from=), verify_lineage_head_receipt's
    # expected.head_ctx_id and verify_receipt's expected_ctx_id, so every
    # identifier must be acdp://<lowercase-DNS-authority>/<v4-uuid> with correct
    # version and variant nibbles — acdp_client.identifiers.synthetic_ctx_id
    # mints those. (3) New: AcdpVerifier.verify_ctx_id_binding(body_json,
    # expected_ctx_id), RFC-ACDP-0006 §4.1 step 7. Those three break or add
    # surface; two additive semantic deltas also reach a caller
    # without being able to break one — EmbeddedContent gained an optional
    # content_hash (so data_refs JSON 0.8.3 rejected is now accepted), and a
    # malformed derived_from id now raises ValueError where 0.8.3 raised
    # RuntimeError. No wheel-ABI change: pyo3 0.29 with abi3-py39 first
    # shipped in acdp 0.8.2, one release before the pin this bump replaces —
    # read out of the published wheels (0.8.1 → pyo3-0.22.6; 0.8.2, 0.8.3 and
    # 0.14.1 → pyo3-0.29.2), not inferred from a manifest or a changelog.
    "acdp>=0.14.1",
]

[project.optional-dependencies]
llm = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
]
multiagent = [
    "crewai>=0.86",
    "langgraph>=0.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

# NOTE: `acdp` resolves from PyPI by default (published maturin/pyo3 wheels —
# no Rust toolchain or sibling checkout needed for a clean `uv sync`). To hack
# on the SDK against a local `../acdp-rs` checkout, run `make build-sdk`, which
# `maturin develop`s the sibling straight into this venv, overriding the wheel
# until the next `uv sync`. See docs/getting-started.md ("Local SDK development").

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acdp_client", "playground"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: conformance checks against a running full stack (make up-full). Skipped unless ACDP_LIVE_STACK is set.",
]

[tool.coverage.run]
source = ["acdp_client", "playground"]
omit = [
    # Optional-extra agent adapters (crewai / langgraph) aren't installed in
    # the offline dev env, so their modules can never execute there.
    "playground/agents/crewai_agent.py",
    "playground/agents/langgraph_agent.py",
]

[tool.coverage.report]
# Live-conformance probe bodies only execute against the real stack
# (make test-live); the offline floor tracks everything else.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
precision = 1
