# registry-c — the dedicated *trust-profile* registry (RFC-ACDP-0010 receipts,
# ACDP 0.2 workstream A; plus the ACDP 0.3.0 head-receipts / lifecycle /
# transparency-log profiles, RFC-ACDP-0011/0012/0013). Unlike registry-a/b,
# this registry verifies every publish (no `[playground]` lax mode) so it can
# mint a receipt that attests the producer key it resolved. The playground
# reaches it through did:key producers (S22/S24, S28–S30): did:key bodies are
# verified by the registry entirely offline (the key is embedded in the DID),
# so no DID hosting is required — which is exactly why this is the
# playground's live verified-publish path.

[registry]
authority = "registry-c.playground.local"
port      = 8300
# 0.0.0.0 opt-in is safe because [auth] is enabled below (see registry-a).
bind      = "0.0.0.0"
# The three ACDP 0.3.0 profiles are listed explicitly for documentation; the
# server appends them anyway (dedup-safe) because the backing features
# ([receipt].head_receipts, [lifecycle], [log]) are enabled below — listing a
# profile WITHOUT its feature is a startup error. Enabling any of the three
# bumps the advertised acdp_version to 0.3.0 (derived; there is no
# acdp_version config key).
profiles  = [
    "acdp-registry-core",
    "acdp-registry-discovery",
    "acdp-registry-head-receipts",
    "acdp-registry-lifecycle",
    "acdp-registry-transparency-log",
]
cross_registry_resolution = true

[registry.tls]
enabled = false

[registry.cors]
allowed_origins = []

[storage]
backend     = "sqlite"
sqlite_path = "/app/data/registry-c.db"
max_connections = 10

[auth]
enabled                = true
# did:key is the verified-publish path for the receipts demo; did:web stays
# mandatory but the playground's *.playground.local DIDs aren't web-hosted,
# so did:web publishes here degrade (their offline cores carry the contract).
did_methods            = ["did:web", "did:key"]
anonymous_public_reads = true
token_ttl_seconds      = 3600
challenge_ttl_seconds  = 300
token_leeway_seconds   = 30
# jwt_secret comes from ACDP_REGISTRY_AUTH__JWT_SECRET (compose env).
require_tenant = false
admin_tokens   = ["playground-registry-admin"]

[webhook]
# Disabled for local-stack demos (registry SSRF refuses http://); see
# registry-a.toml. The playground emits its own SSE directly.
enabled        = false
url            = "http://playground:8000/webhooks/acdp"
timeout_seconds = 5
max_retries    = 3
queue_capacity = 1024

[limits]
max_payload_bytes           = 1048576
max_embedded_bytes          = 65536
idempotency_key_ttl_seconds = 86400
challenge_rate_per_minute   = 60

# ── Registry receipts (RFC-ACDP-0010, ACDP 0.2 workstream A) ─────────
# Provisioning this section makes registry-c a receipts-profile registry:
# every publish response and retrieval carries a registry-signed receipt
# binding ctx_id + lineage_id + content_hash + producer key_fingerprint,
# and the well-known capabilities advertise `acdp-registry-receipts`
# (acdp_version bumps to 0.2.0 — and to 0.3.0 here, because head_receipts /
# [lifecycle] / [log] below are enabled).
#
# The seed is deterministic demo material (sha256("acdp-playground
# -registry-a-receipt-key-v1"), kept for continuity). It MUST stay in
# lock-step with the playground's `registry_c_receipt_seed_b64` setting
# (playground/config.py) — the receipts scenarios derive the registry's
# Ed25519 verification key from the same seed to verify receipts without
# resolving the (non-web-hosted) registry DID. Rotate by adding the old
# public key under [[receipt.retired_keys]] before swapping the seed.
[receipt]
signing_key_seed_b64 = "9NKlBoCp1saUEzMgFonzReHSPbkEN9ba8NrAyR2TYYY="
key_id_fragment      = "receipt-key-1"
# ACDP 0.3.0 (RFC-ACDP-0011): mint a signed lineage-head receipt on every
# `GET /lineages/{id}/current` response, binding lineage → newest head
# (ctx_id + version + status) at a signed `as_of` instant. Requires the
# receipt signing key above; advertises `acdp-registry-head-receipts`.
# Exercised by scenario S30.
head_receipts = true

# ── Lifecycle events & retraction (ACDP 0.3.0, RFC-ACDP-0013) ────────
# Enables POST /contexts/{id}/retract|republish (producer-signed lifecycle
# events; mark-not-delete), the §7 status derivation (`retracted` dominating
# `superseded`/`expired`), the §8.2 default-search exclusion, and the §8.3
# /current head exclusion. Advertises `acdp-registry-lifecycle`. Exercised
# by scenario S28.
[lifecycle]
enabled = true

# ── Transparency log (ACDP 0.3.0, RFC-ACDP-0012) ─────────────────────
# Appends a Merkle leaf per accepted publish and serves GET /log/checkpoint
# (signed tree head, receipt key), /log/proof (inclusion + consistency) and
# /log/entries. `instance` is the <instance> segment of
# log_id = did:web:<authority>/log/<instance>; bump it only on a deliberate
# history reset (§7.4). Advertises `acdp-registry-transparency-log`.
# Exercised by scenario S29.
[log]
enabled  = true
instance = "1"

# NOTE: no [playground] section — incompatible with [receipt] (see
# registry-a.toml). This registry has no unverified publish path.
