[registry]
authority = "registry-a.playground.local"
port      = 8100
# The registry defaults to a loopback bind and refuses a non-loopback bind
# when both TLS and auth are disabled (registry #24, anti-exposure). Binding
# 0.0.0.0 here is the explicit opt-in and is safe because [auth] is enabled
# below — required so the container is reachable across the compose network.
bind      = "0.0.0.0"
profiles  = ["acdp-registry-core", "acdp-registry-discovery"]
cross_registry_resolution = true

[registry.tls]
enabled = false

[registry.cors]
allowed_origins = []

[storage]
backend     = "sqlite"
# WORKDIR is /app and owned by uid 1001 (acdp) per the runtime image —
# named volumes mount as root, so anchor the sqlite file under
# /app/data which the runtime user can write.
sqlite_path = "/app/data/registry-a.db"
max_connections = 10

[auth]
# Auth ON so S6 (restricted-visibility) can exercise the challenge/token
# flow. Other scenarios (S1–S5, S7, S8) keep working because
# anonymous_public_reads = true preserves anonymous access to
# public-visibility contexts.
enabled                = true
# did:key added for the ACDP 0.2 ephemeral-agent scenarios (S25): a
# did:key producer carries its key in the DID itself, so the registry
# verifies it through acdp's pure offline path (no DID-document fetch).
# did:web stays mandatory.
did_methods            = ["did:web", "did:key"]
anonymous_public_reads = true
token_ttl_seconds      = 3600
challenge_ttl_seconds  = 300
token_leeway_seconds   = 30
# jwt_secret comes from ACDP_REGISTRY_AUTH__JWT_SECRET (compose env).
#
# Strict tenancy is OFF so the legacy scenarios (S1–S9) and the demo can
# publish anonymously / unbound (a producer-signed publish with no
# tenant-bound token resolves to no tenant, which `require_tenant = true`
# would reject — see acdp-registry context::tenant_for_publish).
require_tenant = false

# Admin tokens gate POST /admin/pinned-keys/reload (hot key rotation) and
# /admin/status — parity with the control plane's AUTH_ADMIN_API_KEYS. The
# pinned_keys_diff CLI keeps the CP's CONTROL_PLANE_PINNED_KEYS in lock-step.
admin_tokens = ["playground-registry-admin"]

# ── Tenant bindings (issuer-authoritative) ───────────────────────────
# DISABLED in the default stack. The registry fails startup when
# `auth.tenant_agents` is set while `auth.require_tenant = false`
# (multi-tenant fail-fast, SEC #17): a request resolving to no tenant
# would bypass the tenant filter. But `require_tenant = true` would in
# turn reject the anonymous/unbound publishes the rest of the playground
# relies on — the two are mutually exclusive on a single registry.
#
# S10 (tenant isolation) needs these bindings AND `require_tenant = true`
# AND live token issuance (DID-doc hosting). The default stack has none of
# those, so S10 already degrades gracefully. To exercise tenancy for real,
# run a dedicated registry profile with BOTH lines below uncommented and
# `require_tenant = true`:
#   [[auth.tenant_agents]]
#   agent_did = "did:web:registry-a.playground.local:agents:tenant-a-agent"
#   tenant_id = "tenant-a"
#   [[auth.tenant_agents]]
#   agent_did = "did:web:registry-a.playground.local:agents:tenant-b-agent"
#   tenant_id = "tenant-b"

# ── EdDSA JWT signing + JWKS federation (optional) ───────────────────
# Default is HS256 (symmetric, via ACDP_REGISTRY_AUTH__JWT_SECRET). To
# publish a verifiable JWKS for federated peers, switch to EdDSA and
# supply a PKCS#8 Ed25519 PEM (e.g. via ACDP_REGISTRY_AUTH__JWT_PRIVATE_KEY_PEM):
#   jwt_signing_alg     = "EdDSA"
#   jwt_private_key_pem = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"

# ── Cross-issuer revocation feed (full stack only) ───────────────────
# When the control plane is up (docker-compose.full.yml), this registry
# polls the CP's revocation feed and applies revocations locally, so a
# token revoked at the CP is rejected here after one poll interval.
# Uncomment for the full stack:
#   [[auth.revocation_feeds]]
#   issuer      = "control-plane.playground.local"
#   feed_url    = "http://control-plane:3001/auth/revocations"
#   admin_token = "playground-cp-admin"
#   poll_seconds = 30

[webhook]
# Disabled for local-stack demos: the registry's SSRF policy refuses
# `http://` webhook URLs (only https). Loopback/private-host exemption
# for playground mode is a known follow-up. The playground's own SSE
# stream still emits agent.started / acdp.publish / run.complete
# events directly, so the demo isn't degraded.
enabled        = false
url            = "http://playground:8000/webhooks/acdp"
timeout_seconds = 5
max_retries    = 3
queue_capacity = 1024

[limits]
max_payload_bytes           = 1048576
max_embedded_bytes          = 65536
idempotency_key_ttl_seconds = 86400
# Per-agent challenge throttle (registry 2e7b4a5). A burst past this earns a
# 429 + Retry-After; the playground's TokenManager honours it cooperatively.
challenge_rate_per_minute   = 60

# ── Registry receipts (RFC-ACDP-0010, ACDP 0.2 workstream A) ─────────
# registry-a hosts the receipts profile directly: every publish response
# and retrieval carries a registry-signed receipt binding ctx_id +
# lineage_id + content_hash + producer key_fingerprint, and the well-known
# capabilities advertise `acdp-registry-receipts` (acdp_version bumps to
# 0.3.0 because head_receipts / [lifecycle] / [log] below are enabled).
# This coexists with `[playground] pinned_only = true` below — a
# receipts-advertising registry must verify every publish (RFC-ACDP-0010
# §7, no degraded mode), and pinned_only closes the unverified fallback
# (a non-pinned agent is rejected outright, never silently accepted), so
# every publish that reaches this registry is either a verified did:key
# publish or a verified pinned-did:web publish.
#
# The seed is deterministic demo material (sha256("acdp-playground
# -registry-a-receipt-key-v1"), kept for continuity). It MUST stay in
# lock-step with the playground's `receipt_signing_seed_b64` setting
# (playground/config.py) — the receipts scenarios derive the registry's
# Ed25519 verification key from the same seed to verify receipts without
# resolving the (non-web-hosted) registry DID. Rotate by adding the old
# public key under [[receipt.retired_keys]] before swapping the seed.
[receipt]
signing_key_seed_b64 = "9NKlBoCp1saUEzMgFonzReHSPbkEN9ba8NrAyR2TYYY="
key_id_fragment      = "receipt-key-1"
# ACDP 0.3.0 (RFC-ACDP-0011): mint a signed lineage-head receipt on every
# `GET /lineages/{id}/current` response, binding lineage → newest head
# (ctx_id + version + status) at a signed `as_of` instant. Requires the
# receipt signing key above; advertises `acdp-registry-head-receipts`.
# Exercised by scenario S30.
head_receipts = true

# ── Lifecycle events & retraction (ACDP 0.3.0, RFC-ACDP-0013) ────────
# Enables POST /contexts/{id}/retract|republish (producer-signed lifecycle
# events; mark-not-delete), the §7 status derivation (`retracted` dominating
# `superseded`/`expired`), the §8.2 default-search exclusion, and the §8.3
# /current head exclusion. Advertises `acdp-registry-lifecycle`. Exercised
# by scenario S28.
[lifecycle]
enabled = true

# ── Transparency log (ACDP 0.3.0, RFC-ACDP-0012) ─────────────────────
# Appends a Merkle leaf per accepted publish and serves GET /log/checkpoint
# (signed tree head, receipt key), /log/proof (inclusion + consistency) and
# /log/entries. `instance` is the <instance> segment of
# log_id = did:web:<authority>/log/<instance>; bump it only on a deliberate
# history reset (§7.4). Advertises `acdp-registry-transparency-log`.
# Exercised by scenario S29.
[log]
enabled  = true
instance = "1"

[playground]
enabled = true
# pinned_only = true: every publish must match a currently-valid pinned
# key below, or a verified did:key signature — no unverified fallback.
# This is what lets [receipt] above coexist with [playground] at all (see
# the comment there); it's also why every scenario that publishes here
# now uses did:key (a self-verifying identity, no pinning needed) except
# the handful that specifically need a *stable, rotating* identity
# (S12's rotating-publisher demo constant, S24's rotating-historical),
# which are pinned explicitly below.
pinned_only = true

# ── Pinned keys with rotation/overlap windows (RFC-ACDP-0008 §9.3) ────
# Demonstrates key rotation: `rotating-publisher` has an old key valid
# through 2026-06-02 and a new key valid from 2026-06-01, so both verify
# during the overlap window. `valid_from`/`valid_until` are unix seconds
# (inclusive start, exclusive end); omit either for an open bound.
# Edit + `POST /admin/pinned-keys/reload` to rotate without a restart.
# Keys here are deterministic demo material from scripts/gen_keys.py.
[[playground.pinned_keys]]
agent_did      = "did:web:registry-a.playground.local:agents:rotating-publisher"
public_key_b64 = "9tsbbuOon0zOWgZYlL3m+nQ0PTVS9/MWOmQ/EQXgpRk="
algorithm      = "ed25519"
valid_until    = 1780358400  # 2026-06-02T00:00:00Z — old key, expiring

[[playground.pinned_keys]]
agent_did      = "did:web:registry-a.playground.local:agents:rotating-publisher"
public_key_b64 = "V/U68CudHahBq0B1x0+vUM8XQ4ZkmpGwe8G4EScYagI="
algorithm      = "ed25519"
valid_from     = 1780272000  # 2026-06-01T00:00:00Z — new key, overlaps

# ECDSA-P256 pinned agent (registry now accepts ecdsa-p256 on publish).
[[playground.pinned_keys]]
agent_did      = "did:web:registry-a.playground.local:agents:p256-publisher"
public_key_b64 = "BAkSM4c+1uo8uF3Kjtl6HByzTRglGmO/QMHPVZJdxAgoxSMgmllmO90hKczImK8x1BB7aOyEdog3uRvXx1StkF4="
algorithm      = "ecdsa-p256"

# S24 (historical key): a stable identity a consumer can revisit across
# time — the whole point of the scenario is verifying a *pre-rotation*
# signature stays historically authorized, which requires the same DID
# across runs, not a fresh per-run one. Only key_v1 (pre-rotation) is ever
# actually published live; key_v2 exists purely in the scenario's offline
# DID-document simulation. Seed: sha256(b"acdp-playground-fixed-identity:
# rotating-historical"), then sha256(seed + b":v1") — see
# s24_historical_key.py's _stable_seed().
[[playground.pinned_keys]]
agent_did      = "did:web:registry-a.playground.local:agents:rotating-historical"
public_key_b64 = "qIN/TlreKxmlTXqBWUVnGRcCvHhlCmWWtsI7tp2+kpM="
algorithm      = "ed25519"
